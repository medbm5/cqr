# Runs on `git commit` after `make install` (which calls `pre-commit install`).
# Mirrors `make lint` for the Python side so CI and local commits agree.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (strict, risk_engine only)
        files: ^backend/risk_engine/
        args: [--config-file, backend/pyproject.toml]
        additional_dependencies:
          - numpy>=1.26
          - pandas-stubs>=2.2
