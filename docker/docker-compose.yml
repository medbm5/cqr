name: citalid-risk-engine

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DJANGO_SETTINGS_MODULE: api.settings.prod
      SECRET_KEY: ${SECRET_KEY:-change-me-before-any-real-deployment}
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Local demo is served over plain HTTP; terminate TLS at the proxy in a real deployment.
      SECURE_SSL_REDIRECT: "0"
    volumes:
      # The engine reads the CSVs; it must never write to them.
      - ../data:/app/data:ro
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
