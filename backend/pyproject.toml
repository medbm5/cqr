[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "citalid-risk-engine"
version = "0.1.0"
description = "Cyber risk quantification engine: annualized loss from SIEM/EDR telemetry and a peer incident base."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Citalid case study" }]

# risk_engine is a PURE Python package: numeric stack only, never Django.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
api = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
]
prod = [
    "gunicorn>=22.0",
    "whitenoise>=6.7",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pandas-stubs>=2.2",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
]

[project.scripts]
risk-engine = "risk_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
# Only risk_engine is a distributable package; `api` is the Django project,
# `tests` is not shipped.
include = ["risk_engine*"]

# ----------------------------------------------------------------------------
# ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "ARG", # unused arguments
    "PTH", # use pathlib
    "NPY", # numpy legacy random / API
    "D",   # pydocstyle — docstrings are a project requirement
    "RUF",
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Docstring rules only bind the graded package; Django glue and tests are exempt.
"api/**" = ["D"]
"tests/**" = ["D", "ARG"]
"manage.py" = ["D"]

# ----------------------------------------------------------------------------
# mypy — strict, risk_engine only (Django is not type-checked here)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
show_error_codes = true
pretty = true
files = ["risk_engine"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# The API tests need a configured Django; the engine tests never touch it.
DJANGO_SETTINGS_MODULE = "api.settings.dev"
pythonpath = ["."]
addopts = [
    "-q",
    "--strict-markers",
    "--cov=risk_engine",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["risk_engine"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
