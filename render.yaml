# Render blueprint for the API.
#
# The frontend is not here: it deploys to Vercel from `frontend/`, which is why
# this file defines one service rather than two. See the Deployment section of
# the root README for the click-through.

services:
  - type: web
    name: citalid-risk-engine-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # The image needs `data/` as well as `backend/`, so the build context is the
    # repository root rather than the Dockerfile's directory.
    dockerContext: .
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: api.settings.prod
      # Generated by Render on first deploy and never shown in this file.
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      # Render terminates TLS in front of the container and forwards plain HTTP,
      # so redirecting again inside would loop. The proxy header in prod settings
      # is what keeps Django aware the original request was HTTPS.
      - key: SECURE_SSL_REDIRECT
        value: "0"
      - key: ALLOWED_HOSTS
        sync: false # set to the service's own hostname after the first deploy
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the Vercel URL, scheme included
      # Load the dataset and cache the default simulation on boot, so the first
      # visitor does not pay for the cold start on top of the instance spin-up.
      - key: RISK_ENGINE_WARM_START
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
